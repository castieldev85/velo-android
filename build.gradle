// Top-level build file where you can add configuration options common to all
// sub-projects/modules.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.5.1'
        classpath "com.diffplug.spotless:spotless-plugin-gradle:8.11.0"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.21"
    }
}

apply plugin: 'com.android.application'
apply plugin: 'com.diffplug.spotless'

repositories {
    google()
    mavenCentral()
    maven { url='https://jitpack.io'}
    // Velo: Tor incorporato (Guardian Project tor-android)
    maven { url='https://raw.githubusercontent.com/guardianproject/gpmaven/master' }
}


// ROOT INSERT

configurations {
    freeImplementation
    veloFreeImplementation
}

spotless {
    ratchetFrom '2.17.4'
    java {
        target '**/*.java'
        googleJavaFormat().aosp().reflowLongStrings()
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    testImplementation 'junit:junit:4.13.2'
    // The vendored MiniDNS tests (src/test/java/org/minidns, copied from upstream with the vendored
    // sources) are JUnit 5: offline unit tests that run with every test task, plus network
    // integration tests in integrationtest/ (their own @IntegrationTest, not run by JUnit). The
    // app's own tests are JUnit 4 and run on the vintage engine.
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.14.4'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.14.4'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.14.4'
    testRuntimeOnly 'org.junit.vintage:junit-vintage-engine:5.14.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.14.4'
    androidTestImplementation 'junit:junit:4.13.2'

    implementation "androidx.core:core:1.19.1"

    implementation project(':libs:annotation')
    annotationProcessor project(':libs:annotation-processor')

    implementation 'androidx.viewpager:viewpager:1.1.0'

    implementation 'com.github.open-keychain.open-keychain:openpgp-api:v5.7.1'
    implementation "com.vanniktech:android-image-cropper:4.7.0"
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.exifinterface:exifinterface:1.4.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation "androidx.preference:preference:1.2.1"
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.work:work-runtime:2.12.0'

    implementation "androidx.emoji2:emoji2:1.7.0"
    freeImplementation "androidx.emoji2:emoji2-bundled:1.7.0"
    implementation "androidx.emoji2:emoji2-emojipicker:1.7.0"

    implementation 'org.bouncycastle:bcmail-jdk18on:1.86'
    implementation 'com.google.zxing:core:3.5.4'
    implementation 'me.leolin:ShortcutBadger:1.1.22@aar'
    implementation 'org.signal:libsignal-android:0.94.1'
    implementation 'org.whispersystems:signal-protocol-java:2.6.2'
    implementation "com.wefika:flowlayout:0.4.1"

    //noinspection GradleDependency
    implementation 'io.deepmedia.community:transcoder-android:0.11.2'

    implementation 'org.jxmpp:jxmpp-jid:1.1.0'
    implementation 'org.jxmpp:jxmpp-stringprep-libidn:1.1.0'
    implementation 'org.osmdroid:osmdroid-android:6.1.20'
    implementation 'org.hsluv:hsluv:1.0.2'
    implementation 'org.conscrypt:conscrypt-android:2.9.0'
    implementation 'me.drakeet.support:toastcompat:1.1.0'
    implementation "com.leinardi.android:speed-dial:3.3.0"

    implementation "com.squareup.retrofit2:retrofit:3.0.0"
    implementation "com.squareup.retrofit2:converter-gson:3.0.0"
    implementation "com.squareup.okhttp3:okhttp:5.5.1"

    implementation 'com.google.guava:guava:33.8.0-android'
    implementation 'io.michaelrocks:libphonenumber-android:9.0.40'
    implementation 'im.conversations.webrtc:webrtc-android:149.0.0'
    implementation 'io.github.nishkarsh:android-permissions:2.1.8'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.documentfile:documentfile:1.1.0'
    implementation 'androidx.browser:browser:1.10.0'
    implementation 'com.github.martin-stone:hsv-alpha-color-picker-android:3.1.0'
    implementation 'com.github.ipld:java-cid:v1.3.1'
    //implementation 'com.splitwise:tokenautocomplete:3.0.2'
    implementation 'com.github.singpolyma:TokenAutoComplete:bfa93780e0'
    implementation 'com.github.singpolyma:Better-Link-Movement-Method:393d35e453'
    implementation 'com.github.singpolyma:android-identicons:3361281bd4'
    implementation 'com.github.woltapp:blurhash:712a47f946'
    implementation 'com.caverock:androidsvg-aar:1.4'
    implementation 'org.tomlj:tomlj:1.1.1'
    implementation 'com.tbuonomo:dotsindicator:5.1.2'
    implementation 'org.jsoup:jsoup:1.24.1'
    implementation 'androidx.webkit:webkit:1.18.0'
    implementation 'net.fellbaum:jemoji:1.7.6'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation('com.github.bumptech.glide:okhttp3-integration:4.16.0') {
        exclude group: 'glide-parent'
    }
    implementation 'com.github.bumptech.glide:annotations:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    implementation 'com.github.natario1:Autocomplete:v1.1.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'com.github.chrisbanes:PhotoView:2.3.0'
    implementation 'com.mikepenz:materialdrawer:10.0.0-b01'
    implementation 'org.jitsi:org.otr4j:0.23'
    // Velo: dettatura vocale OFFLINE (Vosk, Apache-2.0). Porta il motore nativo (libvosk.so);
    // JNA in versione @aar perche' su Android serve la .so, non il jar.
    implementation 'com.alphacephei:vosk-android:0.3.75'
    implementation 'net.java.dev.jna:jna:5.13.0@aar'
    // Velo: Tor incorporato dentro l'app (niente Orbot). Avvia un Tor locale che serve il
    // proxy SOCKS su 127.0.0.1:9050, lo stesso che Velo usa gia' per connettersi via Tor.
    // Velo: vecchi doc e xls nel lettore documenti. La 4.0.1 e' l'ultima che compila per Android 7; legge solo
    // nel processo isolato DocService. math3 serve al calcolo delle formule, che non facciamo.
    implementation('org.apache.poi:poi:4.0.1') { exclude group: 'org.apache.commons', module: 'commons-math3' }
    implementation('org.apache.poi:poi-scratchpad:4.0.1') { exclude group: 'org.apache.commons', module: 'commons-math3' }
    implementation 'info.guardianproject:tor-android:0.4.9.6'
    implementation 'info.guardianproject:jtorctl:0.4.5.7'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
    // Add Media3
    implementation "androidx.media3:media3-exoplayer:1.11.1"
    implementation "androidx.media3:media3-ui:1.11.1"
    implementation "androidx.media3:media3-session:1.11.1"
    implementation 'com.kizitonwose.calendar:view:2.10.1'
    implementation "io.noties.markwon:core:4.6.2"
    implementation "net.zetetic:sqlcipher-android:4.20.0@aar"
    implementation "androidx.sqlite:sqlite:2.7.1"
    implementation "com.google.crypto.tink:tink-android:1.24.0"
    implementation "androidx.datastore:datastore-preferences:1.3.0"
}

// Velo: the server's key pins (VeloPinning) live outside the source, in velo-local.properties
// next to the project (velo.server.pins = sha256 base64 of the public keys, comma separated).
def veloLocal = new Properties()
def veloLocalFile = rootProject.file('../velo-local.properties')
if (veloLocalFile.exists()) {
    veloLocalFile.withInputStream { veloLocal.load(it) }
}
// Velo: anche dominio e onion del server incorporato stanno in velo-local.properties
// (velo.login.domain, velo.onion.host), cosi' il sorgente non contiene indirizzi.
// Velo pubblica (./gradlew -PveloPublic ...): nessun server incorporato (solo inviti),
// identificativo eu.velochat.velo, niente aggiornamento interno (si aggiorna dallo store).
def veloPublic = project.hasProperty('veloPublic')
def veloDomain = veloPublic ? '' : veloLocal.getProperty('velo.login.domain', '')
def veloOnion = veloPublic ? '' : veloLocal.getProperty('velo.onion.host', '')
def veloPins = veloPublic ? '' : veloLocal.getProperty('velo.server.pins', '')
// Velo 0.49.1 (W1): l'impronta IBRIDA PQ OMEMO2 del dispositivo admin (quella che si legge nei
// dettagli del contatto, "Impronta PQ OMEMO2"), inchiodata nell'app come i pin TLS. Il wipe a
// distanza viene onorato solo se il mittente combacia con questa (lista separata da virgole).
// Vuota (build pubblica) -> wipe disattivato, cosi' un server ostile non puo' far passare una
// chiave admin falsa e cancellare i telefoni.
def veloAdmin = veloPublic ? '' : veloLocal.getProperty('velo.admin.omemo', '')

// Velo V23: una *release* della versione del gruppo NON deve poter partire senza i pin del server,
// altrimenti l'APK pubblicato accetterebbe qualsiasi server (VeloPinning disattivato). La versione
// pubblica (veloPublic) e' invito-only ed e' legittimamente senza pin; debug e unit test non sono
// release e non vengono toccati (la guardia scatta solo su assemble/bundle *Release*).
gradle.taskGraph.whenReady { graph ->
    def releasing = graph.allTasks.any { t ->
        def n = t.name.toLowerCase()
        (n.contains('assemble') || n.contains('bundle')) && n.contains('release')
    }
    if (releasing && !veloPublic) {
        if (veloPins == null || veloPins.trim().isEmpty()) {
            throw new GradleException(
                "Velo: release del gruppo senza 'velo.server.pins' in velo-local.properties — rifiutata " +
                "(l'APK accetterebbe qualsiasi server). Metti i pin, oppure compila la pubblica con -PveloPublic.")
        }
        if (veloAdmin == null || veloAdmin.trim().isEmpty()) {
            logger.warn("Velo V23: release del gruppo senza 'velo.admin.omemo' — il cancella-da-remoto " +
                "(W1) sara' DISATTIVATO in questa build.")
        }
    }
}

ext {
    preDexEnabled = System.getProperty("pre-dex", "true")
    abiCodes = ['armeabi-v7a': 1, 'x86': 2, 'x86_64': 3, 'arm64-v8a': 4]
}

android {
    namespace 'eu.siacs.conversations'
    compileSdk 37
    ndkVersion "28.2.13676358"

    defaultConfig {
        minSdkVersion 24
        targetSdkVersion 37
        versionCode 208
        versionName "2.3.2"
        applicationId "it.velo.chat"
        def appName = "Velo"
        resValue "string", "app_name", appName
        buildConfigField "String", "APP_NAME", "\"$appName\""
        buildConfigField "String", "PRIVACY_POLICY", "null" // Velo: no upstream privacy policy
        buildConfigField "String", "VELO_SERVER_PINS", "\"${veloPins}\""
        buildConfigField "String", "VELO_ADMIN_OMEMO", "\"${veloAdmin}\""
        buildConfigField "String", "VELO_LOGIN_DOMAIN", veloDomain ? "\"${veloDomain}\"" : "null"
        buildConfigField "String", "VELO_ONION_HOST", veloOnion ? "\"${veloOnion}\"" : "null"
        buildConfigField "boolean", "VELO_PUBLIC", veloPublic ? "true" : "false"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Velo: solo arm64, l'unica architettura per cui compiliamo la libreria di cifratura.
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    // Velo: only the four complete languages (other upstream translations are partial)
    androidResources {
        localeFilters += ['en', 'it', 'es', 'fr']
    }

    externalNativeBuild {
        ndkBuild {
            path 'src/main/jni/Android.mk'
        }
    }

    splits {
        abi {
            universalApk false
            enable false
            reset()
            //noinspection ChromeOsAbiSupport
            include project.ext.abiCodes.keySet() as String[]
        }
    }

    configurations {
        implementation.exclude group: 'org.jetbrains' , module:'annotations'
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    flavorDimensions += "mode"
    flavorDimensions += "distribution"

    productFlavors {

        // Velo: fork di monocles 2.3.2 con identità propria (si installa accanto a upstream).
        velo {
            dimension "mode"
            applicationId = veloPublic ? "eu.velochat.velo" : "it.velo.chat"
            versionCode 139
            versionName "0.54.0"
            def appName = "Velo"
            resValue "string", "app_name", appName
            buildConfigField "String", "APP_NAME", "\"$appName\""
            buildConfigField "String", "PRIVACY_POLICY", "null" // Velo: no upstream privacy policy
        }
        free {
            dimension "distribution"
        }
    }

    sourceSets {
        veloFree {
            java {
                srcDir 'src/conversationsFree/java'
            }
            // Velo 0.46.2: the public Velo drops the permissions Google Play refuses
            if (veloPublic) {
                manifest.srcFile 'src/veloPublic/AndroidManifest.xml'
            }
        }
    }

    buildTypes {
        // Velo 0.28: the test build sits beside the real app, signed with the debug key;
        // only this one lets screenshots through (see SettingsUtils)
        debug {
            applicationIdSuffix ".prova"
            versionNameSuffix "-prova"
        }
        release {
            // Velo: no R8. Minified, the 0.11.1 release could no longer build legacy OMEMO
            // sessions (Monal contacts); the code is public anyway, R8 only saved size.
            shrinkResources false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk.debugSymbolLevel = 'full'
        }
    }


    if (new File("signing.properties").exists()) {
        Properties props = new Properties()
        props.load(new FileInputStream(file("signing.properties")))

        signingConfigs {
            release {
                storeFile file(props['keystore'])
                storePassword props['keystore.password']
                keyAlias props['keystore.alias']
                keyPassword props['keystore.password']
                // Velo V23: firma esplicita v2 + v3 (v3 abilita la rotazione futura della chiave).
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
        buildTypes.release.signingConfig = signingConfigs.release
    }

    // Velo: the release key lives outside the project and its password only in the environment
    // of the build (velo-build/compila-release.sh takes it from a copy only this Windows user
    // can decrypt). Never written into a file in clear.
    if (System.getenv('VELO_KEYSTORE') != null) {
        signingConfigs {
            veloRelease {
                storeFile file(System.getenv('VELO_KEYSTORE'))
                storePassword System.getenv('VELO_KEYSTORE_PASSWORD')
                keyAlias 'velo'
                keyPassword System.getenv('VELO_KEYSTORE_PASSWORD')
                // Velo V23: firma esplicita v2 + v3 (v3 abilita la rotazione futura della chiave).
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
        buildTypes.release.signingConfig = signingConfigs.veloRelease
    }

    subprojects {

        afterEvaluate {
            if (getPlugins().hasPlugin('android') ||
                    getPlugins().hasPlugin('android-library')) {

                configure(android.lint) {
                    disable += ['AndroidGradlePluginVersion', 'MissingTranslation']
                    abortOnError = false
                }
            }

        }
    }
    packaging {
        resources {
            excludes += ['META-INF/BCKEY.DSA', 'META-INF/BCKEY.SF', 'META-INF/versions/9/OSGI-INF/MANIFEST.MF', 'META-INF/LICENSE.md', 'META-INF/LICENSE-notice.md']
        }
        jniLibs {
            // libsignal's test build of its native code (a superset of libsignal_jni with
            // test-only entry points). Native.kt loads it in preference to the production
            // library whenever it is present, so it must never ship.
            excludes += ['**/libsignal_jni_testing.so']
        }
    }
    lint {
        disable 'MissingTranslation', 'InvalidPackage', 'AppCompatResource'
        abortOnError false
    }
    buildFeatures {
        buildConfig true
        dataBinding true
        resValues true
    }

    testOptions {
        unitTests {
            // The parser and stanza-model classes under test are plain Java, but they live in
            // files that also reference android.util.* in methods the tests never call. Returning
            // stub defaults keeps class loading from failing on those references.
            returnDefaultValues = true
            // JUnit Platform: Jupiter (vendored MiniDNS tests) and Vintage (JUnit 4 tests).
            all {
                useJUnitPlatform()
            }
        }
    }

}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.resValues.put(
            variant.makeResValueKey("string", "applicationId"),
            variant.applicationId.map { appId ->
                new com.android.build.api.variant.ResValue(appId, null)
            }
        )

        for (def output in variant.outputs) {
            output.outputFileName.set(output.outputFileName.get().replaceFirst('^Conversations-', ''))
            def abiFilter = output.filters.find {
                it.filterType == com.android.build.api.variant.FilterConfiguration.FilterType.ABI
            }
            if (abiFilter != null) {
                def abiCode = project.ext.abiCodes.get(abiFilter.identifier)
                if (abiCode != null) {
                    output.versionCode.set((100 * android.defaultConfig.versionCode) + abiCode)
                }
            }
        }
    }
}
